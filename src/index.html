<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>ClimbProgress</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ClimbProgress – Train with intent. Climb with reserve.">
  <meta name="theme-color" content="#F3F2ED">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ClimbProgress">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // motyw przed startem aplikacji – bez mignięcia jasnego tła w trybie ciemnym
    try { var t = localStorage.getItem('climbprogress.theme'); document.documentElement.dataset.theme = (t === 'dark' || t === 'auto') ? t : 'light'; } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>ClimbProgress wymaga włączonego JavaScriptu.</noscript>
</body>
</html>
